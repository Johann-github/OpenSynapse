[workspace]
resolver = "3"
members = [
    "crates/opensynapse",
    "crates/opensynapse-core",
    "crates/opensynapse-protocol",
    "crates/opensynapse-device-registry",
    "crates/opensynapse-hid",
    "crates/opensynapse-cli",
    "crates/opensynapse-desktop",
    "crates/opensynapse-device",
    "crates/opensynapse-ipc",
    "crates/opensynapse-agent",
]
default-members = ["crates/opensynapse"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Johann-github/OpenSynapse"
description = "Native, local-first alternative to Razer Synapse, written in Rust"

[workspace.dependencies]
opensynapse-core = { path = "crates/opensynapse-core" }
opensynapse-protocol = { path = "crates/opensynapse-protocol" }
opensynapse-device-registry = { path = "crates/opensynapse-device-registry" }
opensynapse-hid = { path = "crates/opensynapse-hid" }
opensynapse-cli = { path = "crates/opensynapse-cli" }
opensynapse-device = { path = "crates/opensynapse-device" }
opensynapse-ipc = { path = "crates/opensynapse-ipc" }
# Linux/macOS only; Windows uses windows-sys directly (ADR-0003).
hidapi = "2"
windows-sys = { version = "0.61", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Lean by design: see vault/Decisions/ADR-0002 Lean by design.md
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
