[package]
name = "opensynapse-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "OpenSynapse background agent: owns the HID devices, serves clients over local IPC."

[lints]
workspace = true

[dependencies]
opensynapse-ipc.workspace = true
opensynapse-device.workspace = true
opensynapse-hid.workspace = true
opensynapse-device-registry.workspace = true
opensynapse-protocol.workspace = true
# Profile parsing for ApplyProfile (pure, no I/O).
opensynapse-core.workspace = true
# Elevation check and parent-console attach (ADR-0006).
opensynapse-sys.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Foreground watch for per-app profiles (SetWinEventHook), ADR-0007.
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

# Foreground watch on Linux X11 (_NET_ACTIVE_WINDOW + eventfd/poll stop), ADR-0013.
[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
x11rb.workspace = true

[dev-dependencies]
opensynapse-device = { workspace = true, features = ["fake"] }

[[bin]]
name = "opensynapse-agent"
path = "src/main.rs"

[build-dependencies]
opensynapse-icon.workspace = true
